<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibrantCart - Colorful E-Commerce Store</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-gradient-to-r from-violet-600 via-fuchsia-600 to-pink-600 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-store text-yellow-300"></i> VIBRANT<span class="text-yellow-300">CART</span>
            </h1>
            <div class="flex items-center gap-6">
                <button onclick="toggleCart()" class="relative bg-white/10 hover:bg-white/25 px-4 py-2 rounded-full font-medium transition flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-yellow-300"></i> Cart 
                    <span id="cart-badge" class="bg-yellow-400 text-slate-900 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Hero Section -->
        <section class="bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 rounded-3xl p-8 md:p-12 text-white shadow-xl mb-12 flex flex-col md:flex-row items-center justify-between">
            <div class="max-w-xl space-y-4">
                <span class="bg-white/20 text-yellow-300 text-xs uppercase tracking-widest font-bold px-3 py-1 rounded-full">New Arrivals</span>
                <h2 class="text-3xl md:text-5xl font-extrabold leading-tight">Elevate Your Everyday Style & Gear</h2>
                <p class="text-indigo-100">Explore our curated collection of vibrant tech accessories, apparel, and lifestyle items.</p>
            </div>
            <div class="mt-6 md:mt-0 text-6xl animate-bounce">
                🛍️✨
            </div>
        </section>

        <!-- Product Grid Header -->
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-2xl font-bold text-slate-900">Featured Products</h3>
        </div>

        <!-- Product Cards Container -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Dynamically populated via script -->
        </div>
    </main>

    <!-- Slide-over Cart Drawer -->
    <div id="cart-drawer" class="fixed inset-0 bg-black/50 z-50 hidden transition-opacity">
        <div class="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col">
            <div class="p-4 bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white flex justify-between items-center">
                <h3 class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-bag-shopping"></i> Your Cart</h3>
                <button onclick="toggleCart()" class="text-white hover:text-yellow-300 text-xl font-bold">&times;</button>
            </div>
            <div id="cart-items" class="p-4 flex-grow overflow-y-auto space-y-4 divide-y">
                <!-- Cart items load here -->
            </div>
            <div class="p-4 border-t bg-slate-50">
                <div class="flex justify-between text-lg font-bold mb-4">
                    <span>Total:</span>
                    <span id="cart-total" class="text-fuchsia-600">$0.00</span>
                </div>
                <button onclick="checkout()" class="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white py-3 rounded-xl font-bold shadow-lg hover:opacity-95 transition">
                    Proceed to Checkout 🚀
                </button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-slate-900 text-white py-6 mt-16 text-center text-sm">
        <p>&copy; 2026 VibrantCart. All rights reserved.</p>
    </footer>

    <!-- App Logic Script -->
    <script>
        const products = [
            { id: 1, name: 'Neon Cyberpunk Hoodie', price: 79.99, category: 'Apparel', image: 'https://images.unsplash.com/photo-1556905055-8f358a7a47b2?auto=format&fit=crop&w=600&q=80' },
            { id: 2, name: 'RGB Mechanical Keyboard', price: 129.99, category: 'Electronics', image: 'https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=600&q=80' },
            { id: 3, name: 'Sunset Gradient Sneaker', price: 95.50, category: 'Footwear', image: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80' },
            { id: 4, name: 'Aesthetic Desk Lamp', price: 45.00, category: 'Home', image: 'https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80' },
            { id: 5, name: 'Wireless Bass Earbuds', price: 59.99, category: 'Electronics', image: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?auto=format&fit=crop&w=600&q=80' },
            { id: 6, name: 'Minimalist Ceramic Mug', price: 22.00, category: 'Home', image: 'https://images.unsplash.com/photo-1514228742587-6b1558fcca3d?auto=format&fit=crop&w=600&q=80' }
        ];

        let cart = [];

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(product => `
                <div class="bg-white rounded-2xl shadow-md overflow-hidden hover:shadow-xl transition flex flex-col justify-between border border-slate-100">
                    <div class="relative h-56 overflow-hidden bg-slate-100">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover hover:scale-105 transition duration-300">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-slate-800 text-xs font-bold px-3 py-1 rounded-full shadow">
                            ${product.category}
                        </span>
                    </div>
                    <div class="p-5 flex flex-col flex-grow justify-between">
                        <div>
                            <h4 class="font-bold text-lg text-slate-800 mb-1">${product.name}</h4>
                            <p class="text-fuchsia-600 font-extrabold text-xl mb-4">$${product.price.toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${product.id})" class="w-full bg-slate-900 hover:bg-gradient-to-r hover:from-violet-600 hover:to-fuchsia-600 text-white font-medium py-2.5 rounded-xl transition shadow">
                            <i class="fa-solid fa-cart-plus mr-2"></i> Add to Cart
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            updateCartUI();
            toggleCart(true);
        }

        function updateQuantity(productId, change) {
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const badge = document.getElementById('cart-badge');
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');

            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            badge.innerText = totalCount;
            totalEl.innerText = `$${totalPrice.toFixed(2)}`;

            if (cart.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-400 py-12">Your cart is empty. Start shopping! ✨</p>`;
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="flex items-center justify-between py-3">
                    <div class="flex items-center gap-3">
                        <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-lg">
                        <div>
                            <h5 class="font-bold text-sm text-slate-800">${item.name}</h5>
                            <p class="text-xs text-slate-500">$${item.price.toFixed(2)} x ${item.quantity}</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="updateQuantity(${item.id}, -1)" class="w-7 h-7 bg-slate-100 rounded-full font-bold text-slate-600 hover:bg-slate-200">-</button>
                        <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)" class="w-7 h-7 bg-slate-100 rounded-full font-bold text-slate-600 hover:bg-slate-200">+</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart(forceOpen = false) {
            const drawer = document.getElementById('cart-drawer');
            if (forceOpen) {
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.toggle('hidden');
            }
        }

        function checkout() {
            if (cart.length === 0) return alert('Your cart is empty!');
            const customerName = prompt('Enter your name for shipping:', 'Customer');
            if (!customerName) return;

            alert(`🎉 Order placed successfully, ${customerName}!\nThank you for shopping with VibrantCart.`);
            cart = [];
            updateCartUI();
            toggleCart();
        }

        // Initialize store view
        renderProducts();
    </script>
</body>
</html>
